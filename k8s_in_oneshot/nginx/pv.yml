apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv
  labels:
    app: local
  namespace: nginx
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:   # For demo/local clusters like Minikube
    path: /mnt/data
